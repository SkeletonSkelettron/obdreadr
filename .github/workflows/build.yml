name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.10.3
  NDK_VERSION: 27.2.12479018 # r27c, the NDK Qt 6.10 is built with

jobs:
  desktop:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libegl-dev libxkbcommon-dev libvulkan-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtconnectivity
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: android_arm64_v8a
          modules: qtconnectivity
          cache: true

      - name: Install Android NDK and SDK packages
        run: |
          command -v ninja || sudo apt-get install -y ninja-build
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          set -o pipefail
          echo "QT_ROOT_DIR=$QT_ROOT_DIR QT_HOST_PATH=$QT_HOST_PATH ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DOBD_VERSION_CODE=${{ github.run_number }} 2>&1 | tee configure.log

      - name: Build APK
        run: |
          set -o pipefail
          cmake --build build --target apk 2>&1 | tee build.log

      # Job logs need a signed-in admin; annotations are public, so put the
      # error there too.
      - name: Report failure
        if: failure()
        run: |
          for log in configure.log build.log; do
            [ -f "$log" ] || continue
            text=$(grep -n -iE -B3 -A10 "error|fatal|could not|not found" "$log" | tail -n 120)
            [ -n "$text" ] || text=$(tail -n 80 "$log")
            text=$(printf '%s' "$text" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$log::$text"
          done

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apk=$(find build -name '*-unsigned.apk' | head -n1)
          [ -n "$apk" ] || apk=$(find build -name '*.apk' | head -n1)
          echo "Built: $apk"
          tools=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)

          # A release key from the repository secrets if there is one;
          # otherwise the shared debug key, so every build can update the last.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            ks=release.keystore ks_pass="$KEYSTORE_PASSWORD" alias="$KEY_ALIAS" key_pass="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            ks=android/debug.keystore ks_pass=android alias=androiddebugkey key_pass=android
          fi

          "$tools/zipalign" -p -f 4 "$apk" aligned.apk
          "$tools/apksigner" sign --ks "$ks" --ks-pass "pass:$ks_pass" --ks-key-alias "$alias" \
            --key-pass "pass:$key_pass" --out obdreadr-arm64-v8a.apk aligned.apk
          "$tools/apksigner" verify obdreadr-arm64-v8a.apk
          rm -f release.keystore aligned.apk

      - uses: actions/upload-artifact@v6
        with:
          name: obdreadr-apk
          path: obdreadr-arm64-v8a.apk

  release:
    name: Publish APK
    needs: [desktop, android]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: obdreadr-apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" obdreadr-arm64-v8a.apk --repo "$GITHUB_REPOSITORY" \
              --title "OBD Reader $GITHUB_REF_NAME" --generate-notes
          else
            # One rolling pre-release that always holds the newest master build.
            gh release delete continuous --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            gh release create continuous obdreadr-arm64-v8a.apk --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --title "Latest build" \
              --notes "Newest build of master ($GITHUB_SHA). Download the APK on the phone and open it to install."
          fi
